[package]
name = "tyco-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
ratatui = "0.26"
crossterm = "0.27"
arboard = "3"
once_cell = "1"
unicode-width = "0.1"
futures-util = "0.3"
base64 = "0.22"
# Encoding is always PNG; the extra decoders are for user-supplied image paths.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
xcap = "0.9"
chromiumoxide = "0.9"
futures = "0.3"

[[bin]]
name = "tyco-live"
path = "src/main.rs"

[profile.release]
opt-level = 2
